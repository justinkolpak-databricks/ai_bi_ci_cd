name: PR Preview Cleanup

on:
  pull_request:
    branches:
      - dev
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download the Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Destroy preview bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          # Create temporary preview target config (same as deploy)
          cat >> databricks.yml << EOF
          
          targets:
            pr-${{ github.event.pull_request.number }}:
              mode: development
              workspace:
                host: \${var.databricks_host_dev}
              root_path: /Workspace/.bundle/pr-previews/pr-${{ github.event.pull_request.number }}
              resources:
                dashboards:
                  path_prefix: "/PR-Previews/pr-${{ github.event.pull_request.number }}"
          EOF
          
          # Destroy the bundle
          databricks bundle destroy -t pr-${{ github.event.pull_request.number }} --auto-approve || true
      
      - name: Clean up workspace folders
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          # Delete the PR-Previews folder for this PR
          databricks workspace delete /PR-Previews/pr-${{ github.event.pull_request.number }} --recursive || echo "Folder already deleted or doesn't exist"
          
          # Also clean up bundle state
          databricks workspace delete /Workspace/.bundle/pr-previews/pr-${{ github.event.pull_request.number }} --recursive || echo "Bundle state already deleted or doesn't exist"
      
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🧹 Preview dashboard has been cleaned up and deleted.'
            });
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Successfully cleaned up preview for PR #${{ github.event.pull_request.number }}"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Cleanup failed for PR #${{ github.event.pull_request.number }}"
          echo "Manual cleanup may be required for /PR-Previews/pr-${{ github.event.pull_request.number }}/"
