name: PR Dashboard Info

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment-dashboard-info:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Find changed dashboard files
        id: changes
        run: |
          # Find changed dashboard JSON files
          CHANGED_FILES=$(git diff --name-only origin/dev...HEAD | grep -E '\.lvdash\.json$|\.dashboard\.json$' || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          # Create summary of changes
          SUMMARY=""
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              DASH_NAME=$(jq -r '.display_name // .displayName // .name // "Unknown"' "$file" 2>/dev/null || echo "Unknown")
              SUMMARY="${SUMMARY}- **${DASH_NAME}** (\`${file}\`)\n"
            fi
          done
          
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo -e "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Comment on PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const branchName = context.payload.pull_request.head.ref;
            const databricksHost = process.env.DATABRICKS_HOST;
            const changes = `${{ steps.changes.outputs.summary }}`;
            
            const body = `## 📊 Dashboard Changes Detected
            
            ### Changed Dashboards:
            ${changes}
            
            ### 🔍 Review Instructions
            
            **Branch:** \`${branchName}\`
            
            To review these dashboards:
            1. Navigate to your Databricks workspace: [${databricksHost}](https://${databricksHost})
            2. Look for dashboards deployed from the \`${branchName}\` branch
            3. Common locations to check:
               - \`/Users/[developer-email]/${branchName}/\`
               - \`/Workspace/[project-name]/${branchName}/\`
            
            ### ✅ Review Checklist
            - [ ] Dashboard renders correctly
            - [ ] All widgets display data as expected
            - [ ] Filters and parameters work properly
            - [ ] No errors in queries
            - [ ] Visual layout is appropriate
            
            ---
            *Once approved, this will be deployed to the dev environment when merged.*
            `;
            
            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Dashboard Changes Detected')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
      
      - name: No dashboard changes
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "ℹ️ No dashboard changes detected in this PR"
